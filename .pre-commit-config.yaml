# Phoenix pre-commit hooks — audit-friendly commit gate
# Per the 2026-05-06 tightening: every commit lands having passed lint/type/test.
# Install once per local clone with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin specific version; bump deliberately, never via auto-update.
    # Must stay in sync with the upper bound of `ruff` in pyproject.toml's
    # [dev] extra, or CI's fresh ruff install will find formatting drift
    # that pre-commit considered fine. Phase 12 CI-fixes (2026-05-15)
    # bumped this from v0.6.9 to v0.9.10 after exactly that scenario.
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Pin specific version; bump deliberately, never via auto-update.
    # Must stay in sync with the upper bound of `mypy` in pyproject.toml's
    # [dev] extra, or CI's fresh mypy install will catch errors that
    # pre-commit considered fine. Phase 12 ci-fixes (2026-05-15) bumped
    # this from v1.11.2 to v1.20.2 after exactly that scenario.
    rev: v1.20.2
    hooks:
      - id: mypy
        # phoenix/mcp/server.py uses @FastMCP.tool decorators that mypy
        # sees as untyped without the [mcp] extra installed in the hook
        # venv. The other optional extras (postgres, nats, otel) are
        # already covered by ignore_missing_imports overrides in
        # pyproject.toml; mcp needs the typed mcp package present so
        # the decorator return type isn't Any.
        additional_dependencies: [pydantic, fastapi, "mcp>=1.0,<2.0"]
        exclude: ^(vendor/|tests/|evals/)

  # Phase 12 ci-fix (2026-05-15) -- shellcheck on the launcher
  # scripts, mirroring what CI's `lint` job does. Without this, SC2064
  # and friends only get caught in CI; this hook closes the loop so
  # local commits surface the same warnings.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: local
    hooks:
      - id: smoke-test
        name: pytest smoke test
        entry: pytest tests/unit/test_smoke.py -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
