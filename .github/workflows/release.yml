# Phoenix v1 release -- Phase 12 Step 7.
#
# Triggered on release tag (v1.0.0rc1, v1.0.0, etc.). Builds all three
# release artifacts per Section 1 Decision 29, smoke-tests each, then
# attaches them to the GitHub Release.
#
# Code signing is deferred to v1.0 release-prep per Phase 12 locked
# scope; this workflow ships unsigned artifacts in v1.0.rc.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write   # write release assets
  packages: write   # push to ghcr.io

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build
        run: pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Smoke install in clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/phoenix --version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-sdist
          path: dist/*
          retention-days: 30

  build-docker:
    name: build + push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/phoenix:${{ env.IMAGE_TAG }} .
      - name: "Smoke: container responds to /v1/health within 60s"
        run: |
          docker run -d --rm --name phoenix-ci -p 8003:8003 \
              ghcr.io/${{ github.repository_owner }}/phoenix:${{ env.IMAGE_TAG }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8003/v1/health >/dev/null 2>&1; then
              echo "container healthy after ${i}*2s"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8003/v1/health
          docker stop phoenix-ci
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/phoenix:${{ env.IMAGE_TAG }}
      - name: Tag latest
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/phoenix:${{ env.IMAGE_TAG }} \
                     ghcr.io/${{ github.repository_owner }}/phoenix:latest
          docker push ghcr.io/${{ github.repository_owner }}/phoenix:latest

  build-standalone:
    name: build standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Phoenix + nuitka
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" "nuitka>=2.0,<3.0"
      - name: Build standalone
        run: python scripts/build_standalone.py
      - name: Smoke --version
        shell: bash
        run: |
          binary=$(ls dist/phoenix-* | grep -v '.dist' | head -1)
          "$binary" --version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-standalone-${{ matrix.os }}
          path: |
            dist/phoenix-*
            !dist/*.whl
            !dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheel, build-docker, build-standalone]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Inspect downloaded artifacts
        run: ls -la artifacts/ && find artifacts/ -type f
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist-wheel-sdist/*
            artifacts/phoenix-standalone-ubuntu-latest/*
            artifacts/phoenix-standalone-windows-latest/*
          fail_on_unmatched_files: false
          body: |
            Phoenix v1 release artifacts:
            - **pip wheel + sdist**: install via `pip install phoenix-middleware`.
            - **Docker image**: pull from `ghcr.io/${{ github.repository_owner }}/phoenix:${{ github.ref_name }}`.
            - **Standalone binary** (Linux + Windows): download from this release.

            See PHOENIX_ARCHITECTURE_v1.md Section 1 Decision 29 + Phase 12 build guide
            for the three-artifact rationale.
