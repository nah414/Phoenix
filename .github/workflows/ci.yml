# Phoenix v1 CI -- Phase 12 Step 7.
#
# Runs on every push to main + every pull request. Per Section 1
# Decision 30, CI tests all three release artifacts (pip wheel,
# Docker image, Nuitka standalone binary) before release. This
# workflow focuses on the always-on test surface; the release.yml
# workflow handles the tag-triggered artifact publish.
#
# Matrix: ubuntu-latest + windows-latest x python 3.11/3.12/3.13.
# macOS deferred to v1.1 per Phase 12 locked scope.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + mypy + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        # [mcp] extra ensures mypy sees FastMCP.tool's typed decorator
        # return; without it, phoenix/mcp/server.py fires untyped-decorator
        # under strict mypy. Other optional extras are handled by
        # ignore_missing_imports overrides in pyproject.toml.
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy strict
        run: mypy phoenix
      - name: shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/launch.sh scripts/launch_with_nats.sh

  tests:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Phoenix + extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,postgres,nats,otel,mcp]"
      - name: pytest -- unit + integration
        run: pytest tests/unit tests/integration -v --tb=short
      - name: pytest -- acceptance (Section 10.7)
        # Marker filter pulls the Section 10.7 acceptance battery out
        # of tests/integration/test_panic_mode/ + test_long_window_replay/.
        run: pytest tests/ -v -m acceptance --tb=short

  build-wheel:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build
        run: pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: "Smoke: wheel installs in a clean venv and imports phoenix + vendor"
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "
          import phoenix, synthesis.equations.base, wobble.disagreement_types, actor, omega, ml, grammar
          assert phoenix.__version__.startswith('1.0.0')
          print('wheel smoke OK:', phoenix.__version__)
          "
          /tmp/venv/bin/phoenix --version
      - name: Upload wheel + sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-sdist
          path: dist/*
          retention-days: 7

  build-docker:
    name: build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t phoenix:ci .
      - name: "Smoke: container reports healthy within 60s"
        run: |
          docker run -d --rm --name phoenix-ci -p 8003:8003 phoenix:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8003/v1/health >/dev/null 2>&1; then
              echo "container healthy after ${i}*2s"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8003/v1/health
          docker stop phoenix-ci
      - name: Image size sanity (under 450 MB)
        # Phase 12 build-guide had a 300 MB aspirational target before
        # all extras were known. Actual v1 runtime image: ~380 MB
        # (python:3.12-slim ~50 + numpy/scipy ~140 + pydantic_core/
        # cryptography/pyjwt ~80 + fastapi/starlette/httpx ~30 +
        # nats-py + nats-server binary ~50 + Phoenix code + other
        # ~25 MB). 450 MB ceiling is honest with ~70 MB headroom; v1.1
        # image-size optimization can tighten via numpy/scipy stripped
        # wheels or a smaller base image.
        run: |
          size_bytes=$(docker image inspect phoenix:ci --format='{{.Size}}')
          size_mb=$((size_bytes / 1024 / 1024))
          echo "image size: ${size_mb} MB"
          if [ "$size_mb" -gt 450 ]; then
            echo "ERROR: image size ${size_mb} MB > 450 MB ceiling" >&2
            exit 1
          fi

  # Nuitka standalone build moved to release.yml only.
  # ---------------------------------------------------------------
  # Rationale: the Nuitka compile for Phoenix's full transitive
  # closure (FastAPI + Pydantic v2 + numpy + scipy + cryptography +
  # 6 vendored namespace packages + all of phoenix.*) genuinely takes
  # 60-80 minutes on 2-core GitHub Actions runners, regardless of
  # --onefile vs --no-onefile mode. The compile phase dominates;
  # onefile just adds a final wrap stage.
  #
  # For per-PR validation, lint + tests + Docker + wheel install
  # cover the surface that matters. The Nuitka binary is a release-
  # artifact concern: it ships at release time, not on every PR. The
  # release.yml workflow (triggered by `v*` tags) builds Nuitka with
  # the same configuration; that's where the 60+ min compile lives.
  #
  # If a contributor wants to validate Nuitka locally before tagging
  # a release, `python scripts/build_standalone.py` works on dev
  # machines (slower than CI's overall budget but uncapped).
  #
  # Phase 12 ci-fix (2026-05-15): removed from per-PR CI after main
  # and PR #12 both hit the 60-min CI timeout in the compile phase.
