[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-middleware"
version = "1.0.0rc1"
description = "Production-grade quantum-accuracy middleware (v1 release candidate)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "quantum",
    "verification",
    "middleware",
    "agents",
    "physics",
    "density-matrix",
    "reproducibility",
]
# Phase 12 Step 1 -- PyPI classifiers per
# https://pypi.org/classifiers/. These shape PyPI search results
# and signal the project's maturity / audience / OS-support /
# license to anyone browsing the index.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.27,<0.35",
    "pydantic>=2.6,<3.0",
    # Phase 1 Step 6 -- vendored physics solvers' core deps.
    "numpy>=1.26,<3.0",       # twelve solvers + DPD engine numerical core
    "scipy>=1.11,<2.0",       # eigensolvers, sparse linalg, ODE integrators
    "pyyaml>=6.0,<7.0",       # vendored grammar's YAML loader (physics_v1.yaml)
    # Phase 8 Step 3 -- system-resource snapshot for /v1/admin/governor.
    # Per locked OPEN-2 (2026-05-11): v1 minimum is psutil-only (CPU/RAM/
    # disk/RSS). GPU/VRAM/NPU/thermal fields land later when the cloud-GPU
    # adapter ships in Phase 9+.
    "psutil>=5.9,<8.0",
    # Phase 9 Step 6 -- CLI HTTP client. Locked OPEN-5 (2026-05-12):
    # httpx (not requests + urllib3) so the CLI shares the same client
    # surface FastAPI's TestClient is built on. Moves from dev-only
    # to main deps when the CLI lands as a first-class surface.
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.3,<0.10",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.6,<4.0",
]
# Phase 6b Step 3 -- Postgres state backend. Opt-in; SQLite is the
# default and requires no extra. Install via:
#     pip install phoenix-middleware[postgres]
# Locked open-item 2 (2026-05-10): sync psycopg3 wrapped in
# asyncio.to_thread at the call sites, symmetric with the SQLite
# stdlib sqlite3 path. ConnectionPool handles concurrent worker
# threads in the pooled-async pattern.
postgres = [
    "psycopg[binary]>=3.1,<4.0",
    "psycopg-pool>=3.2,<4.0",
]
# Phase 6b Step 5 -- NATS JetStream queue + event broker. Opt-in for
# installs that want durable queueing or cross-process pub/sub.
# Install via:
#     pip install phoenix-middleware[nats]
# Locked open-item 3 (2026-05-10): the `nats-server` binary itself is
# user-installed for 1.0.0.dev7 (winget / brew); bundling deferred to
# 1.0.0 release-artifact pipeline. Locked open-item 4 (2026-05-10):
# JetStream consumer modes are mixed per use case -- task ingress
# durable, per-task events ephemeral, drift alerts durable+short-TTL.
nats = [
    "nats-py>=2.6,<3.0",
]
# Phase 7 Step 3 -- OpenTelemetry export adapter for the audit log.
# Opt-in; the native JSONL writer ships by default. Install via:
#     pip install phoenix-middleware[otel]
# Locked open-item 2 (2026-05-11): HTTP/protobuf default (gRPC available
# in 1.x via a separate extra). Activated at runtime by
# $PHOENIX_OTEL_ENABLED=1; the endpoint follows the standard OTel env
# var $OTEL_EXPORTER_OTLP_ENDPOINT.
otel = [
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
]
# Phase 9 Step 9 -- MCP server for Claude Code / Cursor / Cline / etc.
# Opt-in: the CLI works without MCP; only `phoenix mcp serve`
# requires this extra. Install via:
#     pip install phoenix-middleware[mcp]
# Locked OPEN-3 (2026-05-12): stdio transport only in Phase 9.
# Locked OPEN-4 (2026-05-12): official Anthropic `mcp` SDK.
mcp = [
    "mcp>=1.0,<2.0",
]
# Phase 13 Step 2 -- Anthropic Claude SDK for the cognition substrate.
# Opt-in: install only if you need to call Anthropic from Phoenix.
#     pip install phoenix-middleware[anthropic]
anthropic = [
    "anthropic>=0.40,<0.60",
]
# Phase 13 Step 2 -- OpenAI Chat Completions SDK.
#     pip install phoenix-middleware[openai]
openai = [
    "openai>=1.50,<2.0",
]
# Phase 13 Step 2 -- Google Gemini SDK.
#     pip install phoenix-middleware[google]
google = [
    "google-generativeai>=0.8,<1.0",
]
# Phase 13 Step 2 -- umbrella extra that pulls all three cognition
# adapters' SDKs. Convenience for installs that want any LLM:
#     pip install phoenix-middleware[cognition]
cognition = [
    "anthropic>=0.40,<0.60",
    "openai>=1.50,<2.0",
    "google-generativeai>=0.8,<1.0",
]

[project.urls]
Homepage = "https://github.com/nah414/Phoenix"
Repository = "https://github.com/nah414/Phoenix"
Changelog = "https://github.com/nah414/Phoenix/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nah414/Phoenix/blob/main/PHOENIX_ARCHITECTURE_v1.md"
Issues = "https://github.com/nah414/Phoenix/issues"

[project.scripts]
phoenix = "phoenix.cli.entry:main"

# Phase 12 Step 1 -- vendor/ also discovered as a second package-root.
# Per Section 11.7.1, vendored modules retain their upstream import
# paths (synthesis.equations.base, not phoenix.vendor.synthesis.*).
# In editable mode (`pip install -e .`), phoenix/__init__.py injects
# <repo>/vendor into sys.path and those names resolve from there.
# In wheel mode, vendor/ doesn't exist next to phoenix in site-packages,
# so we make setuptools install the vendored packages as siblings of
# phoenix. The result: `pip install phoenix-middleware` puts
# site-packages/{synthesis, wobble, grammar, actor, omega, ml}/ at the
# top level, and the upstream-shaped imports keep working. `namespaces =
# true` is required because actor/ and synthesis/ are PEP 420 implicit
# namespace packages (no __init__.py at their root).
[tool.setuptools.packages.find]
where = [".", "vendor"]
include = [
    "phoenix*",
    "synthesis*",
    "wobble*",
    "grammar*",
    "actor*",
    "omega*",
    "ml*",
]
exclude = ["tests*", "evals*", "scripts*", "docs*", "vendor*"]
namespaces = true

# Phase 12 Step 1 -- ship the per-section README files inside the
# wheel so `pip install phoenix-middleware` users can introspect the
# subsystem docs. The architecture spec stays out of the wheel (it's
# a 2700-line doc; users who need it read it from the repo); only
# the package-internal READMEs travel with the install.
[tool.setuptools.package-data]
phoenix = ["README.md", "**/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "eval_*.py"]
asyncio_mode = "auto"
markers = [
    "smoke: minimal sanity checks runnable in <5s (pre-commit gate).",
    "acceptance: v1 acceptance gate per architecture v1 Section 10.7 -- compositional fail-closed test + long-window replay test.",
    "distribution: Phase 12 distribution acceptance -- builds wheel / sdist / docker / nuitka artifacts and smokes each. Slow; runs in CI release workflow, opt-in locally.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored substrate keeps its upstream formatting verbatim (architecture v1
# Section 11.7.1 -- "vendor verbatim including imports through v1"). Adding
# `vendor` to extend-exclude tells ruff to skip those files for both linting
# and formatting; the pre-commit hooks pass --force-exclude so this is
# honored even when ruff is invoked with explicit vendor/ paths.
extend-exclude = ["vendor"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor/", "build/", "dist/"]

# Vendored module names resolve via sys.path injection (phoenix/__init__.py
# per architecture v1 Section 11.7.1). The vendored code has no type stubs;
# tell mypy not to complain when Phoenix code imports `synthesis.*`, `wobble.*`,
# `grammar.*`, or `actor.*`. The vendored files themselves are excluded above.
[[tool.mypy.overrides]]
module = ["synthesis.*", "wobble.*", "grammar.*", "actor.*", "ml.*"]
ignore_missing_imports = true

# Phase 6b Step 3 -- psycopg + psycopg_pool ship in the `postgres` optional
# extra and may not be installed on SQLite-only Phoenix installs. Tell mypy
# not to error when phoenix/state/postgres_backend.py references them; the
# module's runtime path raises a clear ImportError if construction is
# attempted without the extra installed.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "psycopg_pool", "psycopg_pool.*"]
ignore_missing_imports = true

# Phase 6b Step 5 -- nats-py ships in the `nats` optional extra. Same
# pattern as psycopg above: phoenix/queue/nats_client.py uses TYPE_CHECKING
# guards + lazy runtime imports so SQLite-only installs without the
# `nats` extra import cleanly and only fail at connection time with a
# clear "[nats]" extra hint.
[[tool.mypy.overrides]]
module = ["nats", "nats.*"]
ignore_missing_imports = true

# Phase 7 Step 3 -- opentelemetry ships in the `otel` optional extra.
# phoenix/audit/otel_adapter.py uses TYPE_CHECKING guards + lazy runtime
# imports inside the OTelExporter constructor so installs without the
# `otel` extra import cleanly; OTelExporter.from_env() returns None when
# the activation env var is unset, never reaching the import.
[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

# Phase 7 Step 4 -- vendored Omega Ledger (slim profile, hashchain
# primitives only per locked OPEN-3 Option B). Same pattern as
# synthesis/wobble/grammar/actor: the vendored modules live at
# vendor/omega/ and resolve via the sys.path injection in
# phoenix/__init__.py. The vendored code has no type stubs;
# phoenix/ledger/omega_ledger.py imports omega.ledger inside the
# constructor (lazy + TYPE_CHECKING-guarded).
[[tool.mypy.overrides]]
module = ["omega", "omega.*"]
ignore_missing_imports = true

# Phase 9 Step 9 -- mcp ships in the `mcp` optional extra (the MCP
# server for Claude Code / Cursor / Cline / etc.). Same pattern as the
# nats / opentelemetry overrides: the lint job + most contributor
# environments don't install the [mcp] extra, but phoenix/mcp/server.py
# imports from `mcp.server.fastmcp` at module top-level. With this
# override, mypy treats mcp imports as ignored-missing; the decorator
# call sites use `# type: ignore[untyped-decorator]` to cover the
# now-Any-returning decorator strictly-typed-decorator complaint.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

# Phase 12 ci-fix (2026-05-15) -- psutil ships type-less. mypy 1.20+
# emits `import-untyped` for the bare module import in
# phoenix/admin/health.py. The runtime contract for psutil is well-known
# and stable; rather than pull in types-psutil (an extra dep) we treat
# psutil like the other optional/extra modules.
[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

# Phase 13 Step 2 -- cognition SDKs ship in optional extras. Adapters
# import lazily inside __init__ so installs without the extras import
# cleanly; constructing the adapter without the SDK installed raises
# CognitionError with the install hint. Tests inject mocks at the
# adapter's __init__(client=...) seam.
[[tool.mypy.overrides]]
module = [
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "google",
    "google.generativeai",
    "google.api_core",
    "google.api_core.*",
]
ignore_missing_imports = true
