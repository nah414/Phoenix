[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-middleware"
version = "1.0.0.dev7"
description = "Production-grade quantum-accuracy middleware (Phase 6b -- Infrastructure: State Backends + NATS + Drift Detector)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.27,<0.35",
    "pydantic>=2.6,<3.0",
    # Phase 1 Step 6 -- vendored physics solvers' core deps.
    "numpy>=1.26,<3.0",       # twelve solvers + DPD engine numerical core
    "scipy>=1.11,<2.0",       # eigensolvers, sparse linalg, ODE integrators
    "pyyaml>=6.0,<7.0",       # vendored grammar's YAML loader (physics_v1.yaml)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.29",
    "ruff>=0.3,<0.10",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.6,<4.0",
]
# Phase 6b Step 3 -- Postgres state backend. Opt-in; SQLite is the
# default and requires no extra. Install via:
#     pip install phoenix-middleware[postgres]
# Locked open-item 2 (2026-05-10): sync psycopg3 wrapped in
# asyncio.to_thread at the call sites, symmetric with the SQLite
# stdlib sqlite3 path. ConnectionPool handles concurrent worker
# threads in the pooled-async pattern.
postgres = [
    "psycopg[binary]>=3.1,<4.0",
    "psycopg-pool>=3.2,<4.0",
]
# Phase 6b Step 5 -- NATS JetStream queue + event broker. Opt-in for
# installs that want durable queueing or cross-process pub/sub.
# Install via:
#     pip install phoenix-middleware[nats]
# Locked open-item 3 (2026-05-10): the `nats-server` binary itself is
# user-installed for 1.0.0.dev7 (winget / brew); bundling deferred to
# 1.0.0 release-artifact pipeline. Locked open-item 4 (2026-05-10):
# JetStream consumer modes are mixed per use case -- task ingress
# durable, per-task events ephemeral, drift alerts durable+short-TTL.
nats = [
    "nats-py>=2.6,<3.0",
]

[project.scripts]
phoenix = "phoenix.cli.entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phoenix*"]
exclude = ["vendor*", "tests*", "evals*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "eval_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored substrate keeps its upstream formatting verbatim (architecture v1
# Section 11.7.1 -- "vendor verbatim including imports through v1"). Adding
# `vendor` to extend-exclude tells ruff to skip those files for both linting
# and formatting; the pre-commit hooks pass --force-exclude so this is
# honored even when ruff is invoked with explicit vendor/ paths.
extend-exclude = ["vendor"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor/", "build/", "dist/"]

# Vendored module names resolve via sys.path injection (phoenix/__init__.py
# per architecture v1 Section 11.7.1). The vendored code has no type stubs;
# tell mypy not to complain when Phoenix code imports `synthesis.*`, `wobble.*`,
# `grammar.*`, or `actor.*`. The vendored files themselves are excluded above.
[[tool.mypy.overrides]]
module = ["synthesis.*", "wobble.*", "grammar.*", "actor.*", "ml.*"]
ignore_missing_imports = true

# Phase 6b Step 3 -- psycopg + psycopg_pool ship in the `postgres` optional
# extra and may not be installed on SQLite-only Phoenix installs. Tell mypy
# not to error when phoenix/state/postgres_backend.py references them; the
# module's runtime path raises a clear ImportError if construction is
# attempted without the extra installed.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "psycopg_pool", "psycopg_pool.*"]
ignore_missing_imports = true

# Phase 6b Step 5 -- nats-py ships in the `nats` optional extra. Same
# pattern as psycopg above: phoenix/queue/nats_client.py uses TYPE_CHECKING
# guards + lazy runtime imports so SQLite-only installs without the
# `nats` extra import cleanly and only fail at connection time with a
# clear "[nats]" extra hint.
[[tool.mypy.overrides]]
module = ["nats", "nats.*"]
ignore_missing_imports = true
